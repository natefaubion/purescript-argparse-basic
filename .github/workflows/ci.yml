name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.15.4"
          purs-tidy: "0.8.0"
          spago: "1.0.5"

      - name: Build source
        run: spago build

      - name: Verify formatting
        run: purs-tidy check src
